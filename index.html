<!doctype html>
<html lang="fi">
  <head>

    <title>Tasks</title>

  <body>
    <h1>Task management</h1>

    <!-- Lisätään tehtävä -->
    <section>
      <h2>Add a new task</h2>
      <input type="text" id="taskName" placeholder="Insert new task" />
      <input type="button" id="addTaskBtn" value="Add task" onclick="insertTask()" />
    </section>

    <!-- Näytetään tehtävälista -->
    <section>
      <h2>Task list</h2>
      <div id="tasksList">Tasks are...</div>
    </section>

    <!-- Päivitetään tehtävää-->
    <section>
      <h2>Update task</h2>
      <input type="text" id="updateTaskName" placeholder="Give task name" />

      <select id="newStatus">
        <option value="Not Started">Not started</option>
        <option value="In Progress">In progress</option>
        <option value="Done">Done</option>
      </select>

      <input type="button" value="Update task" onclick="updateTask()" />
    </section>
    <!-- Raportointi -->
    <section>
      <h2>Summary</h2>
      <input type="button" id="showSummaryBtn" value="Show Summary" onclick="showSummary()" />
      <div id="reportArea">Summary of tasks...</div>
    </section>

      document.getElementById("taskName").addEventListener("keydown", function(event) {

  </body>
</html>
